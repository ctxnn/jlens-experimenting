<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">week ↔ year · layer 24: original and alternative next-token alias mass</title><desc id="figure-description">Bars show one prefix forward, not whole-answer probabilities. Saved greedy continuations below use a sustained concept edit and can remain unchanged or produce an unintended answer.</desc><rect width="960" height="650" fill="#121212"/><g font-family="system-ui, sans-serif" fill="#e7e7e7"><text x="36" y="42" font-size="17">week ↔ year · layer 24</text><text x="36" y="76" font-size="13" fill="#aaa">The number of days in the calendar period that starts on Monday and ends on Sunday is</text><text x="36" y="108" font-size="12" fill="#aaa">Next-token alias mass, not whole-answer probability · fixed 0–100% axis</text><text x="36" y="163" font-size="12">clean</text><rect x="265" y="150" width="500" height="13" fill="#303030"/><rect x="265" y="150" width="99.482" height="13" fill="#f7ce68"/><text x="780" y="161" font-size="11">19.90%</text><text x="265" y="180" font-size="11" fill="#aaa">not single-token measurable</text><text x="36" y="217" font-size="12">concept swap</text><rect x="265" y="204" width="500" height="13" fill="#303030"/><rect x="265" y="204" width="29.008" height="13" fill="#f7ce68"/><text x="780" y="215" font-size="11">5.80%</text><text x="265" y="234" font-size="11" fill="#aaa">not single-token measurable</text><text x="36" y="271" font-size="12">no op</text><rect x="265" y="258" width="500" height="13" fill="#303030"/><rect x="265" y="258" width="99.482" height="13" fill="#f7ce68"/><text x="780" y="269" font-size="11">19.90%</text><text x="265" y="288" font-size="11" fill="#aaa">not single-token measurable</text><text x="36" y="325" font-size="12">unrelated swap</text><rect x="265" y="312" width="500" height="13" fill="#303030"/><rect x="265" y="312" width="111.176" height="13" fill="#f7ce68"/><text x="780" y="323" font-size="11">22.24%</text><text x="265" y="342" font-size="11" fill="#aaa">not single-token measurable</text><text x="36" y="379" font-size="12">answer swap</text><text x="265" y="379" font-size="12" fill="#aaa">unavailable</text><text x="36" y="433" font-size="12">random norm matched</text><rect x="265" y="420" width="500" height="13" fill="#303030"/><rect x="265" y="420" width="102.376" height="13" fill="#f7ce68"/><text x="780" y="431" font-size="11">20.48%</text><text x="265" y="450" font-size="11" fill="#aaa">not single-token measurable</text><text x="265" y="498" fill="#f7ce68" font-size="12">Original: 7</text><text x="580" y="498" fill="#dc99ea" font-size="12">Alternative: 365</text><text x="36" y="528" font-size="12" fill="#aaa">Bars: one forward over the supplied prefix. A positive margin change is not an answer-swap success.</text><text x="36" y="555" font-size="12">Clean continuation: “365. To determine this, we first identify”</text><text x="36" y="578" font-size="12">Concept-edit continuation: “365. To determine this, we first identify”</text><text x="36" y="605" font-size="12" fill="#aaa">Continuations: up to 12 greedy tokens; concept edit sustained at layer 24 on every decoding forward.</text><text x="36" y="628" font-size="12" fill="#aaa">Unclamped token-coordinate swap, all prefix positions; not a paper replication.</text></g></svg>