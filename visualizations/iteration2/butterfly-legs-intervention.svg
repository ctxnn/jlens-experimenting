><text x="780" y="288" font-size="11">1.60%</text><text x="36" y="325" font-size="12">unrelated swap</text><rect x="265" y="312" width="500" height="13" fill="#303030"/><rect x="265" y="312" width="436.163" height="13" fill="#f7ce68"/><text x="780" y="323" font-size="11">87.23%</text><rect x="265" y="331" width="500" height="13" fill="#303030"/><rect x="265" y="331" width="7.989" height="13" fill="#dc99ea"/><text x="780" y="342" font-size="11">1.60%</text><text x="36" y="379" font-size="12">answer swap</text><rect x="265" y="366" width="500" height="13" fill="#303030"/><rect x="265" y="366" width="444.068" height="13" fill="#f7ce68"/><text x="780" y="377" font-size="11">88.81%</text><rect x="265" y="385" width="500" height="13" fill="#303030"/><rect x="265" y="385" width="5.590" height="13" fill="#dc99ea"/><text x="780" y="396" font-size="11">1.12%</text><text x="36" y="433" font-size="12">random norm matched</text><rect x="265" y="420" width="500" height="13" fill="#303030"/><rect x="265" y="420" width="433.872" height="13" fill="#f7ce68"/><text x="780" y="431" font-size="11">86.77%</text><rect x="265" y="439" width="500" height="13" fill="#303030"/><rect x="265" y="439" width="7.947" height="13" fill="#dc99ea"/><text x="780" y="450" font-size="11">1.59%</text><text x="265" y="498" fill="#f7ce68" font-size="12">Original: 6</text><text x="580" y="498" fill="#dc99ea" font-size="12">Alternative: 8</text><text x="36" y="528" font-size="12" fill="#aaa">Bars: one forward over the supplied prefix. A positive margin change is not an answer-swap success.</text><text x="36" y="555" font-size="12">Clean continuation: “6. The number of legs on a spider is 8”</text><text x="36" y="578" font-size="12">Concept-edit continuation: “6. The number of legs on a spider is 8”</text><text x="36" y="605" font-size="12" fill="#aaa">Continuations: up to 12 greedy tokens; concept edit sustained at layer 24 on every decoding forward.</text><text x="36" y="628" font-size="12" fill="#aaa">Unclamped token-coordinate swap, all prefix positions; not a paper replication.</text></g></svg>