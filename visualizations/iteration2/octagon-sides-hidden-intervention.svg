<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="figure-title figure-description"><title id="figure-title">octagon ↔ triangle · layer 24: original and alternative next-token alias mass</title><desc id="figure-description">Bars show one prefix forward, not whole-answer probabilities. Saved greedy continuations below use a sustained concept edit and can remain unchanged or produce an unintended answer.</desc><rect width="960" height="650" fill="#121212"/><g font-family="system-ui, sans-serif" fill="#e7e7e7"><text x="36" y="42" font-size="17">octagon ↔ triangle · layer 24</text><text x="36" y="76" font-size="13" fill="#aaa">The number of sides of the polygon used for a standard stop sign is</text><text x="36" y="108" font-size="12" fill="#aaa">Next-token alias mass, not whole-answer probability · fixed 0–100% axis</text><text x="36" y="163" font-size="12">clean</text><rect x="265" y="150" width="500" height="13" fill="#303030"/><rect x="265" y="150" width="457.276" height="13" fill="#f7ce68"/><text x="780" y="161" font-size="11">91.46%</text><rect x="265" y="169" width="500" height="13" fill="#303030"/><rect x="265" y="169" width="1.284" height="13" fill="#dc99ea"/><text x="780" y="180" font-size="11">0.26%</text><text x="36" y="217" font-size="12">concept swap</text><text x="265" y="217" font-size="12" fill="#aaa">unavailable</text><text x="36" y="271" font-size="12">no op</text><text x="265" y="271" font-size="12" fill="#aaa">unavailable</text><text x="36" y="325" font-size="12">unrelated swap</text><rect x="265" y="312" width="500" height="13" fill="#303030"/><rect x="265" y="312" width="457.506" height="13" fill="#f7ce68"/><text x="780" y="323" font-size="11">91.50%</text><rect x="265" y="331" width="500" height="13" fill="#303030"/><rect x="265" y="331" width="1.285" height="13" fill="#dc99ea"/><text x="780" y="342" font-size="11">0.26%</text><text x="36" y="379" font-size="12">answer swap</text><rect x="265" y="366" width="500" height="13" fill="#303030"/><rect x="265" y="366" width="46.116" height="13" fill="#f7ce68"/><text x="780" y="377" font-size="11">9.22%</text><rect x="265" y="385" width="500" height="13" fill="#303030"/><rect x="265" y="385" width="2.296" height="13" fill="#dc99ea"/><text x="780" y="396" font-size="11">0.46%</text><text x="36" y="433" font-size="12">random norm matched</text><text x="265" y="433" font-size="12" fill="#aaa">unavailable</text><text x="265" y="498" fill="#f7ce68" font-size="12">Original: 8</text><text x="580" y="498" fill="#dc99ea" font-size="12">Alternative: 3</text><text x="36" y="528" font-size="12" fill="#aaa">Bars: one forward over the supplied prefix. A positive margin change is not an answer-swap success.</text><text x="36" y="555" font-size="12">Clean continuation: “8. A. True B. False &lt;think&gt;”</text><text x="36" y="578" font-size="12">Concept-edit continuation: unavailable (no single-token concept pair)</text><text x="36" y="605" font-size="12" fill="#aaa">Clean continuation: up to 12 greedy tokens. No edited continuation is available for this concept pair.</text><text x="36" y="628" font-size="12" fill="#aaa">Unclamped token-coordinate swap, all prefix positions; not a paper replication.</text></g></svg>