idth="1.737" height="13" fill="#dc99ea"/><text x="780" y="288" font-size="11">0.35%</text><text x="36" y="325" font-size="12">unrelated swap</text><rect x="265" y="312" width="500" height="13" fill="#303030"/><rect x="265" y="312" width="482.451" height="13" fill="#f7ce68"/><text x="780" y="323" font-size="11">96.49%</text><rect x="265" y="331" width="500" height="13" fill="#303030"/><rect x="265" y="331" width="1.536" height="13" fill="#dc99ea"/><text x="780" y="342" font-size="11">0.31%</text><text x="36" y="379" font-size="12">answer swap</text><rect x="265" y="366" width="500" height="13" fill="#303030"/><rect x="265" y="366" width="481.810" height="13" fill="#f7ce68"/><text x="780" y="377" font-size="11">96.36%</text><rect x="265" y="385" width="500" height="13" fill="#303030"/><rect x="265" y="385" width="1.194" height="13" fill="#dc99ea"/><text x="780" y="396" font-size="11">0.24%</text><text x="36" y="433" font-size="12">random norm matched</text><rect x="265" y="420" width="500" height="13" fill="#303030"/><rect x="265" y="420" width="479.669" height="13" fill="#f7ce68"/><text x="780" y="431" font-size="11">95.93%</text><rect x="265" y="439" width="500" height="13" fill="#303030"/><rect x="265" y="439" width="2.679" height="13" fill="#dc99ea"/><text x="780" y="450" font-size="11">0.54%</text><text x="265" y="498" fill="#f7ce68" font-size="12">Original: 8</text><text x="580" y="498" fill="#dc99ea" font-size="12">Alternative: 6</text><text x="36" y="528" font-size="12" fill="#aaa">Bars: one forward over the supplied prefix. A positive margin change is not an answer-swap success.</text><text x="36" y="555" font-size="12">Clean continuation: “8 Question: What is the atomic number of the element”</text><text x="36" y="578" font-size="12">Concept-edit continuation: “8 Context: The atomic number of an element is”</text><text x="36" y="605" font-size="12" fill="#aaa">Continuations: up to 12 greedy tokens; concept edit sustained at layer 24 on every decoding forward